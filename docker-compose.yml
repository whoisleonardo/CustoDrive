services:
  db:
    image: postgres:16-alpine
    container_name: costdrive-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-costdrive}
      POSTGRES_USER: ${POSTGRES_USER:-costdrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-costdrive}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-costdrive} -d ${POSTGRES_DB:-costdrive}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - costdrive-network

  backend:
    build:
      context: ./backend
    container_name: costdrive-backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/costdrive}
      DB_USERNAME: ${POSTGRES_USER:-costdrive}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-costdrive}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deploying-please-123456}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-72}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - costdrive-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: costdrive-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - costdrive-network

volumes:
  postgres_data:

networks:
  costdrive-network:
    driver: bridge
