server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: costdrive-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/costdrive}
    username: ${DB_USERNAME:costdrive}
    password: ${DB_PASSWORD:costdrive}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-before-deploying-please-123456}
    expiration-hours: ${JWT_EXPIRATION_HOURS:72}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}

logging:
  level:
    com.costdrive: INFO
